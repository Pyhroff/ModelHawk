[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "modelhawk"
version = "1.1.0"
description = "Static scanner for malicious ML model files — pickle RCE, unsafe YAML, numpy object arrays"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.8"
keywords = [
    "security", "machine-learning", "pickle", "scanner",
    "malware", "supply-chain", "yaml", "numpy", "red-team",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.scripts]
modelhawk = "modelhawk:main"

[project.urls]
Repository = "https://github.com/Pyhroff/ModelHawk"
Issues = "https://github.com/Pyhroff/ModelHawk/issues"

[tool.setuptools]
py-modules = ["modelhawk"]
